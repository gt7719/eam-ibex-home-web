<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="iBeX Mobile App-ийн интерактив туршилтын орчин">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%235f63f2'/%3E%3Cpath d='M18 18h8v28h-8zm13 8h8v20h-8zm13-8h8v28h-8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <title>iBeX Mobile Preview</title>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="iBeX Mobile prototype">
      <div class="app" id="app">
        <div class="statusbar"><strong id="clock">20:08</strong><span class="status-icons" aria-label="Сүлжээ, Wi-Fi, батарей"><span class="cellular" aria-hidden="true"><i></i><i></i><i></i><i></i></span><svg class="wifi" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 5.5C7.7.8 16.3.8 22 5.5M5.5 9.5c3.7-3 9.3-3 13 0M9 13.2c1.7-1.3 4.3-1.3 6 0"/><circle cx="12" cy="16" r="1.25"/></svg><span class="battery" aria-hidden="true"><i></i></span></span></div>
        <header class="app-header" id="appHeader">
          <button class="icon-button" id="menuButton" aria-label="Үндсэн цэс"></button>
          <h1 id="screenTitle"></h1>
          <div class="header-actions"><button class="icon-button" id="notificationButton" aria-label="Мэдэгдэл"></button><button class="language-chip" id="languageButton" aria-label="Хэл солих">MN</button></div>
        </header>
        <div class="content" id="content"></div>
        <nav class="bottom-nav" id="bottomNav" aria-label="Доод цэс">
          <button data-nav="home" aria-label="Нүүр"></button><button data-nav="stats" aria-label="Статистик"></button><span class="nav-gap" aria-hidden="true"></span><button data-nav="work-hub" aria-label="Ажлууд"></button><button data-nav="settings" aria-label="Тохиргоо"></button>
        </nav>
        <button class="primary-fab" id="requestFab" aria-label="Шинэ хүсэлт"><span aria-hidden="true"></span></button>
        <div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="Үндсэн цэс"></aside><aside class="quick-rail" id="quickRail" aria-label="Хурдан цэс"></aside>
        <div class="rail-controls" id="railControls"><button id="railMenuButton" aria-label="Хурдан цэс нээх"></button><button id="railBackButton" aria-label="Өмнөх дэлгэц рүү буцах"></button></div>
        <div class="modal-layer" id="modalLayer"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
